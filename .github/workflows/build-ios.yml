name: Build iOS IPA (No Mac Needed)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests (Simulator)
        working-directory: ios
        run: |
          xcodebuild test \
            -project LivePhotoLink.xcodeproj \
            -scheme LivePhotoLink \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iOS .app for device (arm64)
        working-directory: ios
        run: |
          xcodebuild build \
            -project LivePhotoLink.xcodeproj \
            -scheme LivePhotoLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned LivePhotoLink.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LivePhotoLink.app Payload/
          zip -r LivePhotoLink-unsigned.ipa Payload

      - name: Upload LivePhotoLink IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoLink-iOS-IPA
          path: ios/LivePhotoLink-unsigned.ipa
          retention-days: 30
